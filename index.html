<style>
/* Home. Top: the name in Hershey Duplex Light with a red bar set off-register behind it, the way
   "Ohm" sits on its tape: the bar starts after the "a" of Grant and runs on under the start of
   the section tabs. Below, alone and centred: the bull with its struck eyes. */
.home{max-width:84rem;margin:0 auto;padding-block:2.4rem 3rem;display:grid;gap:clamp(2rem,5vw,4rem)}
.ohm{--nf:clamp(40px,5.6vw,80px);display:flex;flex-wrap:wrap;align-items:flex-end;row-gap:1rem;isolation:isolate}
.namebar{margin:0;font:300 var(--nf)/1 var(--title);white-space:nowrap;color:var(--ink)}
.namebar .on-bar{position:relative}
.namebar .on-bar::before{content:"";position:absolute;z-index:-1;left:.04em;right:-.6em;bottom:-.08em;height:.5em;
  background:url("assets/drawings/name-bar.png") center/100% 100% no-repeat}
.tabs{position:relative;display:flex;flex-wrap:wrap;gap:.4rem 1.6em;padding:0 0 .7em calc(var(--nf) * .6 + 1.1rem);font:500 clamp(12px,calc(1.05vw + 1px),15px)/1 var(--title);letter-spacing:.2em;text-transform:uppercase}
.tabs a:hover{color:var(--red)}
.bull{justify-self:center;width:min(28rem,76vw);margin:0}
.bull img{width:100%}
@media (max-width:760px){
  .ohm{--nf:clamp(34px,10.5vw,60px)}
  .namebar .on-bar::before{right:-.15em}
  .tabs{width:100%;padding:.6rem 0 0;gap:.7rem 1.4em}
}
</style>
</head>
